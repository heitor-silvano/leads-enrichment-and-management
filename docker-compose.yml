services:
  postgres:
    image: postgres:15
    container_name: leads-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backend_challenge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:15
    container_name: leads-postgres-test
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backend_challenge_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 10 && ollama pull tinyllama && wait"]


  rabbitmq:
    image: rabbitmq:3-management
    container_name: leads-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  mock-api:
    build:
      context: ./mock-api
    container_name: leads-mock-api
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leads-api
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/backend_challenge
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      MOCK_API_URL: http://mock-api:3001
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - postgres
      - rabbitmq
      - mock-api
      - ollama
    command: >
      sh -c "npx prisma migrate deploy && node dist/src/main"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: leads-worker
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/backend_challenge
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      MOCK_API_URL: http://mock-api:3001
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - postgres
      - rabbitmq
      - ollama

volumes:
  postgres_data:
  postgres_test_data:
  rabbitmq_data:
  ollama_data: